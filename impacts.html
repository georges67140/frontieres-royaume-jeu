function controls(){const locked=!!action;for(const id of ['arrow','bullet','melee'])document.querySelector('#'+id).disabled=locked||dummy.hp<=0;document.querySelector('#guard').disabled=locked||dummy.hp<=0||dummy.shield<=0;document.querySelector('#armor').disabled=locked;document.querySelector('#zone').disabled=locked;document.querySelector('#health').textContent='Vie '+Math.ceil(dummy.hp)+' / 100 · Bouclier '+Math.ceil(dummy.shield)+' / 100';document.querySelector('#stats').textContent=hits+' impact(s) · '+(dummy.armor==='veteran'?'Armure renforcée':'Tenue légère')+' · valeurs de jeu';}
function burst(px,py,type,n){for(let i=0;i<n;i++){const angle=i*2.399+sequence*.7,force=25+(i%5)*14;particles.push({x:px,y:py,vx:Math.cos(angle)*force,vy:-25-Math.abs(Math.sin(angle))*force,t:0,type});}if(particles.length>180)particles.splice(0,particles.length-180);}
function bodyDamage(kind,zone){const raw=kind==='bullet'?(zone==='head'?160:zone==='leg'?48:90):kind==='arrow'?(zone==='head'?95:zone==='leg'?22:38):36;const armor=dummy.armor==='veteran'?(kind==='bullet'?.82:zone==='head'?.55:.6):1;return Math.round(raw*armor);}
function hurt(damage,px,py){dummy.hp=Math.max(0,dummy.hp-damage);dummy.hit=1;if(showBlood)burst(px,py,'blood',8);if(dummy.hp===0)setMessage('Soldat hors de combat · réinitialise pour comparer.');}
function impact(kind,zone,px,py){hits++;sequence++;const blocked=dummy.raised&&dummy.guard>.92&&dummy.shield>0&&zone==='body';if(zone==='ground'){burst(px,0,'earth',10);if(kind==='arrow')groundArrows.push({x:px,t:0});setMessage('Terre soulevée · '+(kind==='arrow'?'flèche plantée.':'impact de balle.'));return;}
if(blocked){const before=dummy.shield,loss=kind==='bullet'?64:kind==='melee'?28:12;dummy.shield=Math.max(0,before-loss);dummy.hit=1;burst(px,py,'wood',kind==='bullet'?14:7);if(kind==='arrow'&&dummy.shield>0)dummy.stuck.push({shield:true,dx:-15+(sequence*7)%28,dy:-15+(sequence*11)%30});if(dummy.shield===0){dummy.stuck=dummy.stuck.filter(h=>!h.shield);burst(px,py,'fragment',10);dummy.raised=false;setMessage('Bouclier brisé · le soldat est exposé !');}else setMessage(kind==='bullet'?'Balle traversante · le bois ne suffit pas !':'Bouclier touché · '+dummy.shield+' de résistance.');if(kind==='bullet')hurt(Math.round(bodyDamage(kind,zone)*(dummy.shield===0?.7:.25)),px,py);}
else{const damage=bodyDamage(kind,zone);hurt(damage,px,py);if(kind==='arrow')dummy.stuck.push({shield:false,dx:zone==='leg'?7:0,dy:zone==='head'?-118:zone==='leg'?-28:-78});if(dummy.hp>0)setMessage((kind==='arrow'?'Flèche':kind==='bullet'?'Balle':'Lame')+' · '+damage+' dégâts · '+(dummy.armor==='veteran'?'armure amortissante.':'soldat blessé.'));}dummy.stuck=dummy.stuck.slice(-12);}
function launch(kind){const zone=document.querySelector('#zone').value,yy=zone==='head'?-118:zone==='leg'?-28:zone==='ground'?0:-78;projectiles.push({kind,zone,t:0,duration:kind==='bullet'?.27:.68,x:-100,y:-96,startX:-100,startY:-96,endX:zone==='ground'?90:zone==='body'&&dummy.raised&&dummy.shield>0?109:145,endY:yy});if(kind==='bullet')smokes.push({x:-100,y:-96,t:0});}
function attack(kind){if(action||dummy.hp<=0)return;action=kind;actionTime=0;loadShooter();clock=0;mode=kind==='arrow'?'shoot':kind==='bullet'?'fire':'idle';weapon=kind==='bullet'?'musket':'sword';ammo=1;setMessage(kind==='arrow'?'Encocher · tendre · viser…':kind==='bullet'?'Épauler · viser…':'Armer le coup…');controls();}
function reset(){action=null;mode='idle';clock=0;actionTime=0;Object.assign(dummy,{hp:100,shield:100,guard:1,raised:true,fall:0,hit:0,stuck:[]});projectiles=[];particles=[];smokes=[];groundArrows=[];hits=0;document.querySelector('#guard').textContent='🛡 Baisser le bouclier';setMessage('Cible prête · chaque attaque attend ton ordre.');controls();}
for(const id of ['arrow','bullet','melee'])document.querySelector('#'+id).onclick=()=>attack(id);
document.querySelector('#reset').onclick=reset;
document.querySelector('#guard').onclick=()=>{if(action||dummy.shield<=0)return;dummy.raised=!dummy.raised;document.querySelector('#guard').textContent=dummy.raised?'🛡 Baisser le bouclier':'🛡 Lever le bouclier';};
document.querySelector('#armor').onchange=e=>{dummy.armor=e.target.value;reset();};
document.querySelector('#blood').onclick=()=>{showBlood=!showBlood;particles=particles.filter(p=>p.type!=='blood');document.querySelector('#blood').textContent='🩸 Sang : '+(showBlood?'oui':'non');};
function tick(dt){worldTime+=dt;dummy.guard+=clamp((dummy.raised?1:0)-dummy.guard,-dt*1.5,dt*.6);dummy.hit=Math.max(0,dummy.hit-dt*3);if(dummy.hp===0)dummy.fall=Math.min(1,dummy.fall+dt*.9);if(action){const before=actionTime;actionTime+=dt;if(action==='melee'){if(before<1.05&&actionTime>=1.05){const zone=document.querySelector('#zone').value;impact('melee',zone,124,zone==='head'?-118:zone==='leg'?-28:zone==='ground'?0:-78);}if(actionTime>2.5)action=null;}else{update(dt);if(mode==='idle'&&projectiles.length===0)action=null;}}
for(const p of projectiles){p.t+=dt;const k=clamp(p.t/p.duration,0,1);p.x=mix(p.startX,p.endX,k);p.y=mix(p.startY,p.endY,k)-(p.kind==='arrow'?Math.sin(Math.PI*k)*30:0);if(k>=1)impact(p.kind,p.zone,p.x,p.y);}projectiles=projectiles.filter(p=>p.t<p.duration);
for(const p of particles){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;if(p.y>0){p.y=0;p.vx*=.85;p.vy=0;}}particles=particles.filter(p=>p.t<(p.type==='blood'?6:p.type==='fragment'?9:1.8));smokes.forEach(p=>p.t+=dt);smokes=smokes.filter(p=>p.t<5);groundArrows.forEach(p=>p.t+=dt);controls();}
function render(){g.fillStyle='#243b30';g.fillRect(0,0,W,H);g.save();g.translate(W/2,H*.61);const zoom=Math.min(W/410,H/610,1.8);g.scale(zoom,zoom);ellipse(0,3,210,64,'#7f775538');for(let i=0;i<160;i++){const px=Math.sin(i*72.3)*205,py=Math.cos(i*48.7)*50;line([[px,py],[px+Math.sin(worldTime+i),py-3]],'#adad6940',1);}for(const a of groundArrows){const wobble=Math.sin(a.t*40)*Math.exp(-a.t*8)*3;line([[a.x-28, -17+wobble],[a.x,0]],'#dac498',2);}
const snapshot={mode,clock,weapon,guard,face,x,chargeBlend,bodyX,frontRank,time};loadShooter();time=worldTime;g.save();g.translate(-145+(action==='melee'?smooth(actionTime/.7)*205*(1-smooth((actionTime-1.5)/.8)):0),0);if(action==='melee')chargeBlend=.9;warrior();if(action==='melee'){const swingT=clamp((actionTime-.65)/.4,0,1);g.save();g.translate(22,-86);g.rotate(-1.2+swingT*2);line([[0,0],[28,0]],'#d5dece',4);g.restore();}g.restore();
weapon='sword';mode=dummy.raised?'shield':'idle';clock=0;guard=dummy.guard;frontRank=true;face=-1;x=0;chargeBlend=0;bodyX=0;defenderDrawing=true;g.save();g.translate(145+dummy.hit*5,0);g.rotate(dummy.fall*1.4);warrior();g.restore();defenderDrawing=false;
({mode,clock,weapon,guard,face,x,chargeBlend,bodyX,frontRank,time}=snapshot);
for(const p of projectiles){const k=p.t/p.duration,dy=(p.endY-p.startY)-(p.kind==='arrow'?Math.PI*30*Math.cos(Math.PI*k):0),angle=Math.atan2(dy,p.endX-p.startX);line([[p.x-Math.cos(angle)*25,p.y-Math.sin(angle)*25],[p.x,p.y]],p.kind==='bullet'?'#fff1b8':'#decaa0',p.kind==='bullet'?2:1.8);}
for(const p of particles){g.globalAlpha=Math.max(0,1-p.t/(p.type==='blood'?6:p.type==='fragment'?9:1.8));if(p.type==='fragment')poly([[p.x-3,p.y],[p.x+5,p.y-8],[p.x+7,p.y+3]],'#8c704b');else ellipse(p.x,p.y,p.type==='blood'?2:1.8,p.type==='blood'&&p.y===0?1:2,p.type==='blood'?'#922f2a':p.type==='earth'?'#b69e6e':'#caac70');}g.globalAlpha=1;
for(const p of smokes){for(let i=0;i<5;i++){const radius=9+p.t*15,px=p.x+p.t*15+i*5,py=p.y-p.t*9+Math.sin(i*3+p.t)*8;const cloud=g.createRadialGradient(px,py,0,px,py,radius);cloud.addColorStop(0,'rgba(221,216,192,'+(.22*(1-p.t/5))+')');cloud.addColorStop(1,'rgba(221,216,192,0)');ellipse(px,py,radius,radius,cloud);}}g.restore();}
reset();document.addEventListener('visibilitychange',()=>last=performance.now());function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;tick(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></html>
