<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Les Rangs du Nord — Le poids du geste</title><style>
*{box-sizing:border-box}body{margin:0;background:#15221e;color:#eee3c9;font:14px system-ui;overflow:hidden}canvas{width:100%;height:100dvh;display:block;touch-action:none}header{position:fixed;top:env(safe-area-inset-top,0);left:0;right:0;padding:24px;text-align:center;pointer-events:none}small{font-size:10px;letter-spacing:3px;color:#a8b5a0}h1{font:25px Georgia;margin:8px}header p{font-size:12px;color:#c4ccb8}nav{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(94%,520px);display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{min-height:62px;background:#1c2b26e8;color:#f3e4c4;border:1px solid #9b9567;border-radius:7px;font:13px Georgia}button.active{background:#65573b}button:disabled{opacity:.5}#state{position:fixed;bottom:94px;width:100%;text-align:center;color:#eadbb1;font:13px Georgia;pointer-events:none}#phase{display:block;font:11px system-ui;color:#aebba8;margin-top:5px}a{color:#d4c399}#note{position:fixed;right:14px;top:14px;font-size:11px}</style>
<canvas id="c"></canvas><header><small>LES RANGS DU NORD • ÉTUDE JOUABLE</small><h1>Le poids du geste</h1><p>Touchez le sol pour faire marcher Eirik.</p></header><div id="state">Eirik · garde du Nord<span id="phase">Un guerrier articulé, pieds ancrés au sol.</span></div><nav><button id="walk">Marcher</button><button id="charge">⚔ Charger</button><button id="shield">🛡 Bouclier</button><button id="shoot">🏹 Tirer</button></nav><script>
(()=>{'use strict';
const c=document.querySelector('#c'),g=c.getContext('2d'),state=document.querySelector('#state'),phase=document.querySelector('#phase');let W,H,scale,ox,oy,time=0,last=0,mode='idle',clock=0,guard=0,arrows=[],dust=[],steps=[],target=0,x=0,speed=0,face=1,cycle=0,foot=[-13,13],start=[-13,13],end=[-13,13],swing=-1,progress=0,bodyX=0,chargeBlend=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t,smooth=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
function resize(){W=innerWidth;H=innerHeight;const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;g.setTransform(d,0,0,d,0,0);scale=Math.min(W/420,H/760,1.7);ox=W/2;oy=H*.69}addEventListener('resize',resize);resize();
function order(m){if(mode==='shoot'&&clock<17)return; if(mode==='charge'&&clock<.7)return; if((m==='walk'||m==='charge')&&Math.abs(x)>70)face=-Math.sign(x);mode=m;clock=0;document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.id===m));if(m==='walk'||m==='charge')target=clamp(x+face*(m==='charge'?190:95),-145,145);}
document.querySelector('#walk').onclick=()=>order('walk');document.querySelector('#charge').onclick=()=>order('charge');document.querySelector('#shield').onclick=()=>order(mode==='shield'?'idle':'shield');document.querySelector('#shoot').onclick=()=>order('shoot');
c.onpointerdown=e=>{if(mode==='shoot'&&clock<17)return;target=clamp((e.clientX-ox)/scale,-145,145);order('move');};
function poly(points,fill,stroke='#202522',width=1.5){g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}
function ellipse(x,y,rx,ry,fill){g.fillStyle=fill;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function line(points,color,w){g.strokeStyle=color;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.stroke()}
function gradient(a,b){let q=g.createLinearGradient(-25,-100,28,-50);q.addColorStop(0,a);q.addColorStop(1,b);return q}
function segment(a,b,width,color){const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),nx=-Math.sin(ang),ny=Math.cos(ang);poly([[a[0]+nx*width,a[1]+ny*width],[b[0]+nx*width*.72,b[1]+ny*width*.72],[b[0]-nx*width*.72,b[1]-ny*width*.72],[a[0]-nx*width,a[1]-ny*width]],color);line([[a[0]-nx*width*.4,a[1]-ny*width*.4],[b[0]-nx*width*.3,b[1]-ny*width*.3]],'#a69a7938',1.5)}
function knee(hip,ankle){const dx=ankle[0]-hip[0],dy=ankle[1]-hip[1],d=Math.max(1,Math.hypot(dx,dy)),l=33,h=Math.sqrt(Math.max(0,l*l-d*d/4));return[(hip[0]+ankle[0])/2+dy/d*h*.65,(hip[1]+ankle[1])/2-dx/d*h*.65]}
function leg(h,a,near){const k=knee(h,a);segment(h,k,near?9:8,near?'#525b57':'#39453e');segment(k,[a[0],a[1]-5],7,near?'#615943':'#474637');for(let j=0;j<4;j++){const t=.48+j*.11;line([[mix(k[0],a[0],t)-5,mix(k[1],a[1],t)],[mix(k[0],a[0],t)+5,mix(k[1],a[1],t)+1]],'#a58b5c',1)}poly([[a[0]-7,a[1]-9],[a[0]+5,a[1]-9],[a[0]+13,a[1]-3],[a[0]+13,a[1]],[a[0]-8,a[1]]],gradient('#5f4a32','#302b22'));line([[a[0]-7,a[1]],[a[0]+13,a[1]]],'#171d18',2)}
function shield(px,py,tilt,raise=guard){g.save();g.translate(px,py);g.rotate(tilt);g.scale(1,mix(1,.32,raise));ellipse(2,2,28,32,'#222722');ellipse(0,0,28,32,'#86866b');ellipse(0,0,25,29,gradient('#566b69','#253e42'));g.save();g.beginPath();g.ellipse(0,0,25,29,0,0,Math.PI*2);g.clip();for(let i=-20;i<24;i+=8)line([[i,-30],[i,30]],'#141f2280',1);poly([[-25,-7],[25,4],[25,11],[-25,0]],'#a09062',null);g.restore();for(let i=0;i<12;i++){let a=i*Math.PI/6;ellipse(Math.cos(a)*26,Math.sin(a)*30,1.2,1.2,'#d0b784')}ellipse(0,0,8,9,gradient('#c4c9ba','#424f4e'));line([[-17,12],[-10,5]],'#b1aa7b',1);g.restore()}
// Equipment is never exchanged instantly: forward/reverse the same physical path.
function equipment(){const active=mode==='shoot';const t=active?(clock<12?Math.min(clock,5):Math.max(0,17-clock)):0;return {t,align:smooth((t-.8)/.7),insert:smooth((t-1.5)/1.1),stow:smooth((t-2.6)/1.2),take:smooth((t-3.8)/1.2),aim:active&&clock>=5&&clock<12};}
function drawBow(h,pull=0){g.strokeStyle='#b69b67';g.lineWidth=3;g.beginPath();g.moveTo(h[0]+3,h[1]-31);g.quadraticCurveTo(h[0]+22,h[1],h[0]+3,h[1]+31);g.stroke();line([[h[0]+3,h[1]-31],[h[0]+3-pull*31,h[1]],[h[0]+3,h[1]+31]],'#ded3b5',.8);}
function warrior(){const travel=speed>1,settle=travel?Math.sin(progress*Math.PI)*2:Math.sin(time*1.6)*.3,crouch=guard*12+chargeBlend*5;const hip=[bodyX,-57+crouch+settle],shoulder=[bodyX+2+face*chargeBlend*11,-100+crouch+settle];let a=foot.map((f,i)=>[f-x,i===swing?-Math.sin(progress*Math.PI)*(9+chargeBlend*5):0]);
// Every planted foot remains at its world coordinate until its own swing starts.
g.save();g.translate(x,0);g.scale(face,1);a=a.map(p=>[p[0]*face,p[1]]);hip[0]*=face;shoulder[0]*=face;
const eq=equipment(),back=[shoulder[0]-22,shoulder[1]+17];const lift=smooth(guard);const shieldHome=[shoulder[0]-13+lift*12-Math.sin(Math.PI*lift)*12,shoulder[1]+28-lift*96];const sh=[mix(shieldHome[0],back[0],eq.stow)-Math.sin(eq.stow*Math.PI)*25,mix(shieldHome[1],back[1],eq.stow)-Math.sin(eq.stow*Math.PI)*35];if(eq.stow>.55)shield(...sh,-.2*eq.stow,guard*(1-eq.stow));if(eq.take===0){g.save();g.translate(shoulder[0]-14,shoulder[1]+12);g.rotate(-.35);drawBow([0,0]);g.restore();}ellipse(5,2,34,6,'#17241a35');for(let i=0;i<2;i++)ellipse(a[i][0],2,10,2,i===swing?'#19231b28':'#15211980');
poly([[shoulder[0]-17,shoulder[1]-1],[hip[0]-26,-25+crouch],[hip[0]+3,-31+crouch],[shoulder[0]+13,shoulder[1]]],gradient('#875342','#493d31'));line([[shoulder[0]-13,-91+crouch],[hip[0]-19,-37+crouch]],'#c08d653e',2);
leg([hip[0]-7,hip[1]],a[0],false);leg([hip[0]+8,hip[1]],a[1],true);
poly([[shoulder[0]-17,shoulder[1]],[shoulder[0]+18,shoulder[1]+1],[hip[0]+20,hip[1]+17],[hip[0]+2,hip[1]+23],[hip[0]-21,hip[1]+15]],gradient('#6f7770','#374948'));for(let row=0;row<7;row++)for(let col=0;col<6;col++){const px=hip[0]-15+col*5+(row%2)*2,py=shoulder[1]+18+row*5;g.strokeStyle='#b0b4a04b';g.lineWidth=.7;g.beginPath();g.arc(px,py,2,0,Math.PI);g.stroke()}
line([[hip[0]-18,hip[1]+4],[hip[0]+17,hip[1]+6]],'#382e23',7);poly([[hip[0]-2,hip[1]+1],[hip[0]+5,hip[1]+1],[hip[0]+5,hip[1]+9],[hip[0]-2,hip[1]+9]],'#b49b65');
// The scabbard stays on the belt in every pose.
const mouth=[hip[0]-15,hip[1]+1],tip=[mouth[0]-10,mouth[1]+37];
line([mouth,tip],'#231f1a',8);line([mouth,tip],'#66533a',5);line([[mouth[0]-5,mouth[1]],[mouth[0]+4,mouth[1]+2]],'#c2aa73',3);
const normal=[shoulder[0]+24+chargeBlend*8,shoulder[1]+32-chargeBlend*24],pre=[mouth[0]+9,mouth[1]-34],seated=[mouth[0]+1,mouth[1]-4];
let hand=[mix(normal[0],pre[0],eq.align),mix(normal[1],pre[1],eq.align)];hand=[mix(hand[0],seated[0],eq.insert),mix(hand[1],seated[1],eq.insert)];
let bowHand=[mix(back[0],shoulder[0]+39,eq.take),mix(back[1],shoulder[1]-2,eq.take)-Math.sin(eq.take*Math.PI)*22];
if(eq.take>0)hand=bowHand;
let elbow=[mix(shoulder[0]+25,hand[0]-7,.55),mix(shoulder[1]+16,hand[1]+11,.55)];segment(shoulder,elbow,8,'#59665d');segment(elbow,hand,6,'#76664d');ellipse(...hand,4,4,'#c2a07b');
// Only the exposed portion of the blade is drawn while it slides into the sheath.
const hilt=eq.insert===1?seated:hand,dx=mix(6+chargeBlend*25,-9,eq.align),dy=mix(34-chargeBlend*34,34,eq.align);
if(eq.insert<1)line([hilt,[hilt[0]+dx*(1-eq.insert),hilt[1]+dy*(1-eq.insert)]],'#b7c5ba',4);
line([[hilt[0]-6,hilt[1]+2],[hilt[0]+7,hilt[1]+3]],'#a69264',3);line([[hilt[0],hilt[1]+1],[hilt[0]+2,hilt[1]-7]],'#5c3824',4);
let shieldPose=eq.stow<=.55?sh:null;
if(eq.take>0){const shotClock=clock-5,draw=eq.aim?smooth((shotClock-2)/1.8)*(shotClock<4.5?1:1-smooth((shotClock-4.5)/.22)):0;drawBow(bowHand,draw);const pulling=[bowHand[0]+3-draw*31,bowHand[1]];segment([shoulder[0]-9,shoulder[1]+2],[shoulder[0]-15,shoulder[1]+18],8,'#677166');segment([shoulder[0]-15,shoulder[1]+18],pulling,6,'#786c50');ellipse(...pulling,4,4,'#b9926a');if(eq.aim&&shotClock>1&&shotClock<4.5)line([[pulling[0]-5,pulling[1]],[bowHand[0]+22,pulling[1]-2]],'#d6c5a2',1.4);
}else{segment([shoulder[0]-11,shoulder[1]+1],[sh[0]-6,sh[1]+12],9,'#555f54');segment([sh[0]-6,sh[1]+12],sh,6,'#76674f');}
let hx=shoulder[0],hy=shoulder[1]-18;ellipse(hx,hy,12,15,'#b69772');poly([[hx-12,hy-2],[hx-10,hy+13],[hx-3,hy+23],[hx+5,hy+20],[hx+12,hy+8],[hx+10,hy]],gradient('#77614a','#4f483a'));for(let j=0;j<7;j++)line([[hx-9+j*3,hy+5],[hx-6+j*2,hy+17+(j%3)]],'#b2a08477',.9);ellipse(hx+7,hy-2,1.2,1,'#1c2824');line([[hx+8,hy+1],[hx+12,hy+4],[hx+8,hy+5]],'#806445',1);g.fillStyle=gradient('#afb5a8','#526361');g.beginPath();g.arc(hx,hy-4,13,Math.PI,0);g.lineTo(hx+13,hy);g.lineTo(hx-13,hy);g.closePath();g.fill();line([[hx-13,hy-1],[hx+13,hy-1]],'#343f39',3);line([[hx+3,hy-15],[hx+4,hy+6]],'#bbc0ae',3);if(shieldPose)shield(...shieldPose,-guard*.13-.2*eq.stow,guard*(1-eq.stow));g.restore();}
function update(dt){time+=dt;clock+=dt;guard+=clamp((mode==='shield'?1:0)-guard,-dt/.95,dt/2.1);chargeBlend=mix(chargeBlend,mode==='charge'?1:0,Math.min(1,dt*4));let remaining=target-x,charging=mode==='charge',walking=(mode==='walk'||mode==='move'||charging)&&Math.abs(remaining)>2&&(!charging||clock>=.7);const desired=walking?Math.min(charging?66:32,Math.abs(remaining)*(charging?1.9:1.4)):0;speed+=clamp(desired-speed,-dt*85,dt*(charging?40:24));if(walking&&swing<0){face=Math.sign(remaining)||face;swing=cycle%2;start[swing]=foot[swing];end[swing]=x+face*(charging?31:24);progress=0;}

if(swing>=0){progress=Math.min(1,progress+dt/Math.max(.30,.7-speed*.007));foot[swing]=mix(start[swing],end[swing],smooth(progress));x+=face*speed*dt;bodyX=clamp((foot[0]+foot[1])/2-x,-9,9);if(progress>=1){steps.push({x:foot[swing],age:0});dust.push({x:foot[swing],age:0,power:1+chargeBlend});swing=-1;cycle++;if(!walking){target=x;mode=mode==='move'||mode==='walk'||mode==='charge'?'idle':mode;}}}else bodyX=mix(bodyX,0,dt*3);if(!walking&&swing<0&&speed<.5&&(mode==='walk'||mode==='move'||mode==='charge'&&clock>.7)){mode='idle';target=x;}
if(mode==='shoot'&&clock-dt<9.5&&clock>=9.5)arrows.push({x:x+face*45,y:-99,dir:face,t:0});for(const a of arrows){a.t+=dt;a.x+=a.dir*150*dt;a.y+=(-60+170*a.t)*dt;}arrows=arrows.filter(a=>a.y<0&&a.t<3);dust.forEach(a=>a.age+=dt);dust=dust.filter(a=>a.age<1);steps.forEach(a=>a.age+=dt);steps=steps.filter(a=>a.age<18);if(mode==='shoot'&&clock>17)mode='idle';document.querySelectorAll('nav button').forEach(b=>{b.disabled=mode==='shoot'||(mode==='charge'&&clock<.7);b.classList.toggle('active',b.id===mode);});phase.textContent=mode==='shoot'?(clock<.8?'Abaisser la garde':clock<1.5?'Amener l’épée au fourreau':clock<2.6?'Rengainer la lame':clock<3.8?'Passer le bouclier dans le dos':clock<5?'Prendre l’arc':clock<6.2?'Saisir la flèche':clock<7?'Encocher':clock<8.8?'Tendre la corde':clock<9.5?'Viser':clock<10?'Relâcher':clock<12?'Reprendre son souffle':clock<13.2?'Ranger l’arc':clock<14.4?'Reprendre le bouclier':clock<16.2?'Dégainer l’épée':'Reprendre la garde'):mode==='charge'?(clock<.7?'Prendre appui · préparer l’élan':Math.abs(remaining)<30?'Freiner · retrouver sa garde':'Accélérer · épée en avant'):mode==='shield'?(guard<.99?'Lever · accompagner le poids':'Bouclier au-dessus de la tête'):speed>1?'Appui · transfert du poids · pas suivant':'Touchez le terrain pour déplacer Eirik.';}
function render(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b302b');bg.addColorStop(.4,'#526249');bg.addColorStop(1,'#253a2c');g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.translate(ox,oy);g.scale(scale,scale);ellipse(0,-10,210,95,'#88866a35');for(let i=0;i<450;i++){let px=Math.sin(i*127.1)*195,py=Math.cos(i*73.7)*95;let trampled=Math.abs(px-x)<25&&Math.abs(py)<9;line([[px,py],[px+Math.sin(time*1.3+i)*(trampled?4:1.5),py-(trampled?1:3+i%5)]],i%3?'#a8af7352':'#223c2b77',.8)}for(const p of steps)ellipse(p.x,1,7,2,`rgba(30,32,20,${.2*(1-p.age/18)})`);warrior();for(const p of dust)ellipse(p.x-p.age*7,-p.age*6,(2+p.age*5)*(p.power||1),(1+p.age*3)*(p.power||1),`rgba(184,174,126,${(1-p.age)*.14})`);for(const a of arrows)line([[a.x-a.dir*20,a.y],[a.x,a.y]],'#e3d8b5',1.5);g.restore()}
document.addEventListener('visibilitychange',()=>last=performance.now());function frame(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></html>
