    soldiers.push({i,row,col,archer,phase:Math.random()*6.28,skill:.55+Math.random()*.45,delay:((7-col)*.13+row*.09+Math.random()*.3),x:0,y:0,px:0,py:0,nx:null,ny:null,gait:0,velocity:0,fired:false});
  }
  function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);groundTop=H*.15;groundBottom=H*.84}
  addEventListener('resize',resize);resize();
  function setMode(m,keepDestination=false){
    if(m===mode)return;
    if(mode==='archer'&&actionTime<7.8)return;
    if(m==='archer'&&cooldown>0)return;
    mode=m;actionTime=0;soldiers.forEach(s=>s.fired=false);
    if(m==='regroup'||m==='shield')compact=true;
    if(m==='charge')compact=false;
    if(m==='archer')cooldown=9;
    document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.action===m));
    const names={march:'MARCHE LOURDE',charge:'CHARGE EN VAGUE',shield:'LE MUR SE FORME…',archer:'LES ARCHERS ENCOCHENT',regroup:'RESSERREZ LES RANGS !',ready:'FORMATION PRÊTE'};
    document.querySelector('#status').textContent=names[m];
    if(!keepDestination&&(m==='charge'||m==='march'))targetX=Math.min(.72,formationX+(m==='charge'?.24:.16));
  }
  document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setMode(b.dataset.action)}));
  function pointer(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
  cv.addEventListener('pointerdown',e=>{const p=pointer(e);if(Math.abs(p.x-formationX)<.18&&Math.abs(p.y-formationY)<.22){drag=p;cv.setPointerCapture(e.pointerId);document.querySelector('#hint').style.opacity=0}});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const p=pointer(e);targetX=Math.max(.16,Math.min(.82,p.x));targetY=Math.max(.38,Math.min(.70,p.y));});
  cv.addEventListener('pointerup',e=>{if(!drag)return;drag=null;setMode('march',true)});
  cv.addEventListener('pointercancel',()=>{drag=null});
  function burstDust(){for(let i=0;i<60;i++)dust.push({x:formationX*W+(Math.random()-.5)*W*.35,y:formationY*H+(Math.random()-.5)*H*.18,a:.35+Math.random()*.4,r:2+Math.random()*7,vx:-8-Math.random()*18,vy:-3-Math.random()*12})}
  function update(dt){time+=dt;actionTime+=dt;stepDt=dt;cooldown=Math.max(0,cooldown-dt);
    document.querySelector('[data-action="archer"]').disabled=cooldown>0;
    let speed=mode==='charge'?.07:mode==='march'?.032:0;speed*=Math.min(1,actionTime/1.3);
    let dx=targetX-formationX,dy=targetY-formationY,d=Math.hypot(dx,dy);
    if(!drag&&d>.002&&speed){let s=Math.min(d,speed*dt);formationX+=dx/d*s;formationY+=dy/d*s}
    if(mode==='shield'&&soldiers.filter(s=>!s.archer).every(s=>s.protected))document.querySelector('#status').textContent='BOUCLIERS EN POSITION';
    if(mode==='regroup'&&actionTime>3.5&&soldiers.every(s=>s.velocity<.002))document.querySelector('#status').textContent='RANGS RESSERRÉS';
    if(mode==='charge'&&Math.random()<dt*16)dust.push({x:(formationX-.10+Math.random()*.22)*W,y:(formationY+.06+Math.random()*.16)*H,a:.45,r:3+Math.random()*8,vx:-14,vy:-10});
    dust.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*.28;p.r+=dt*3});dust=dust.filter(p=>p.a>0);
    if(mode==='archer'){
      soldiers.filter(s=>s.archer).forEach(s=>{if(!s.fired&&actionTime>=releaseTime(s)){s.fired=true;launchArrow(s)}});
      document.querySelector('#status').textContent=actionTime<1.8?'ENCOCHER…':actionTime<4.7?'TENDRE · VISER…':actionTime<6.6?'VOLÉE !':'RECHARGEMENT…';
      if(actionTime>=9)setMode('ready');
    }
    soldiers.forEach(layout);
    updateProjectiles(dt);
  }
  function releaseTime(s){return 4.7+s.delay*.35+(1-s.skill)*.65;}
  function launchArrow(s){
    const duration=1.45+(1-s.skill)*.35;
    const spread=(1-s.skill)*.11;
    arrows.push({sx:s.nx+.014,sy:s.ny,ex:Math.min(.96,s.nx+.36),ey:Math.max(.25,Math.min(.79,s.ny+Math.sin(s.phase*7)*spread)),t:0,duration,height:.028,apex:.10,landed:false,age:0});
  }
  function updateProjectiles(dt){
    arrows.forEach(a=>{if(a.landed){a.age+=dt;return;}a.t=Math.min(a.duration,a.t+dt);if(a.t>=a.duration){a.landed=true;dust.push({x:a.ex*W,y:a.ey*H,a:.35,r:2,vx:4,vy:-5});}});
    arrows=arrows.filter(a=>!a.landed||a.age<16).slice(-120);
  }
  function drawArrows(ground){
    arrows.forEach(a=>{if(a.landed!==ground)return;
      const u=a.t/a.duration,x=(a.sx+(a.ex-a.sx)*u)*W;
      const gy=(a.sy+(a.ey-a.sy)*u)*H,z=(a.height*(1-u)+4*a.apex*u*(1-u))*H;
      const angle=Math.atan2(((a.ey-a.sy)+a.height-4*a.apex*(1-2*u))*H,(a.ex-a.sx)*W);
      ctx.save();ctx.globalAlpha=a.landed?Math.min(1,(16-a.age)/2):1;
      if(!ground){ctx.fillStyle='#16201830';ctx.beginPath();ctx.ellipse(x,gy,5,1.4,0,0,7);ctx.fill();}
      ctx.translate(x,gy-z);ctx.rotate(angle);ctx.strokeStyle='#b79a66';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-13,0);ctx.lineTo(0,0);ctx.stroke();
      ctx.fillStyle='#dce0d6';ctx.beginPath();ctx.moveTo(2,0);ctx.lineTo(-2,-1.8);ctx.lineTo(-2,1.8);ctx.fill();
      ctx.strokeStyle='#ddd7bb';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-13,-2);ctx.lineTo(-10,0);ctx.lineTo(-13,2);ctx.stroke();ctx.restore();
    });
  }
  function drawBg(){const im=sprites.bg;if(im.complete&&im.naturalWidth){ctx.drawImage(im,0,0,W,H)}else{ctx.fillStyle='#53634a';ctx.fillRect(0,0,W,H)};let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#08131888');g.addColorStop(.2,'#0000');g.addColorStop(.75,'#0000');g.addColorStop(1,'#050a09cc');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
  function layout(s){
    const tight=compact?1:0;
    const spacing=.057-tight*.008;
    let bx=formationX+(s.col-3.5)*spacing+(s.row%2)*.012;
    let by=formationY+(s.row-2)*(.065-tight*.014)+(s.col-3.5)*.005;
    if(mode==='charge'){
      const fan=Math.min(1,actionTime/4);
      bx+=Math.sin(s.phase)*.014*fan;
      by+=(s.row-2)*.014*fan;
    }
    if(s.nx===null){s.nx=bx;s.ny=by;}
    const dx=bx-s.nx,dy=by-s.ny,dist=Math.hypot(dx,dy);
    const canMove=(actionTime>s.delay||mode==='ready')&&!(mode==='archer'&&s.archer);
    const vmax=(mode==='charge'?.10:.055)*(1-(s.guard||0)*.8);
    const desired=canMove?Math.min(vmax,dist*1.8):0;
    s.velocity+=(desired-s.velocity)*Math.min(1,stepDt*3);
    const travel=Math.min(dist,s.velocity*stepDt);
    if(dist>.0001){s.nx+=dx/dist*travel;s.ny+=dy/dist*travel;}
    s.gait+=travel*110;
    const goal=mode==='shield'&&!s.archer&&actionTime>s.delay?1:0;
    s.guard=Math.max(0,Math.min(1,(s.guard||0)+(goal?1:-1)*stepDt/(goal?2.8-s.skill:1.5)));
    s.protected=s.guard>.94;
    s.x=s.nx*W;s.y=s.ny*H;
  }
  function animFor(s){
    if(s.guard>.01&&!s.archer)return['shield',s.guard*3];
    if(mode==='archer'&&s.archer){let c=actionTime-s.delay*.35;if(c<1.8)return['nock',Math.min(3,Math.max(0,c)*1.8)];if(actionTime<releaseTime(s))return['draw',Math.min(3,(c-1.8)*1.5)];return['release',Math.min(3,(actionTime-releaseTime(s))*4)]}
    if(s.velocity>.003)return['walk',s.gait];
    return['ready',0];
  }
  function drawSoldier(s){
    const [a,f]=animFor(s),arr=sprites[a],im=arr[Math.floor(f)%arr.length];
    const sz=Math.min(86,Math.max(39,W*.095))*(.9+s.row*.045);
    ctx.save();ctx.translate(s.x,s.y);
    ctx.fillStyle='#141b1380';ctx.beginPath();ctx.ellipse(4,0,sz*.24,sz*.07,-.2,0,7);ctx.fill();
    ctx.fillStyle='#090d0baa';ctx.beginPath();ctx.ellipse(0,0,sz*.12,sz*.035,0,0,7);ctx.fill();
    const blend=f-Math.floor(f),next=arr[(Math.floor(f)+1)%arr.length];
    if(im&&im.complete&&im.naturalWidth){ctx.globalAlpha=1;ctx.drawImage(im,-sz*.5,-sz,sz,sz);if(blend>0&&next.complete&&next.naturalWidth){ctx.globalAlpha=blend;ctx.drawImage(next,-sz*.5,-sz,sz,sz);ctx.globalAlpha=1;}}
    ctx.restore();
  }
  function drawFlag(){let x=formationX*W- W*.13,y=formationY*H-H*.12;ctx.save();ctx.strokeStyle='#3a2718';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y+45);ctx.lineTo(x,y-23);ctx.stroke();ctx.fillStyle='#751d19';ctx.beginPath();ctx.moveTo(x,y-22);ctx.quadraticCurveTo(x+27+Math.sin(time*2)*3,y-17,x+38,y-3);ctx.quadraticCurveTo(x+20,y+2,x,y-2);ctx.fill();ctx.fillStyle='#e2c47b';ctx.font='bold 13px Georgia';ctx.fillText('ᚠ',x+9,y-5);ctx.restore()}
  function drawGhost(){if(!drag)return;ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#f3d486';ctx.setLineDash([5,5]);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(targetX*W,targetY*H,W*.23,H*.18,0,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(formationX*W,formationY*H);ctx.lineTo(targetX*W,targetY*H);ctx.stroke();ctx.restore()}
  function render(){drawBg();drawGhost();drawArrows(true);dust.forEach(p=>{ctx.fillStyle=`rgba(184,155,104,${p.a})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});soldiers.slice().sort((a,b)=>a.y-b.y).forEach(drawSoldier);drawFlag();drawArrows(false)}
  function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame)}requestAnimationFrame(frame);
  setTimeout(()=>document.querySelector('#hint').style.opacity=.65,3500);
})();
</script>
</body></html>
