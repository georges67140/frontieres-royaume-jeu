<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b18">
<title>Atelier du guerrier — aperçu graphique 0.3</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101b18;color:#eee5cf;font:12px system-ui,-apple-system,sans-serif}
header{height:46px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px max(12px,env(safe-area-inset-right)) 5px max(12px,env(safe-area-inset-left));border-bottom:1px solid #b8a27155}
#status{font-size:11px;color:#cdb983;line-height:1.35}a{color:#dfcfaa;white-space:nowrap}
iframe{display:block;width:100%;height:calc(100% - 46px);border:0}
</style>
</head>
<body>
<header><span id="status" role="status">Atelier 0.3 · chargement du guerrier…</span><a href="./index.html">Comparer à l’original</a></header>
<iframe id="workshop" title="Atelier du guerrier Babylon, aperçu graphique 0.3" src="./index.html"></iframe>
<script>
(function(){
  'use strict';
  const frame=document.getElementById('workshop'),status=document.getElementById('status');
  const report=window.RDNPreview={version:'0.3.0',state:'loading',errors:[]};
  let timer=null,attempts=0,installing=false,installed=null,generation=0;
  function stop(){if(timer!==null)clearInterval(timer);timer=null;}
  // Add-ons execute in Babylon's iframe realm: its WebGL buffers must not
  // receive plain Arrays created by the parent window.
  function loadInWorkshop(win,src,name){
    if(win[name])return Promise.resolve();
    return new Promise((resolve,reject)=>{
      const script=win.document.createElement('script');let settled=false;
      const timeout=setTimeout(()=>done(new Error('Chargement trop long : '+src)),10000);
      function done(error){if(settled)return;settled=true;clearTimeout(timeout);script.onload=null;script.onerror=null;if(error){script.remove();reject(error);}else resolve();}
      script.src=new URL(src,win.location.href).href;
      script.onload=()=>done(win[name]?null:new Error('Module non initialisé : '+name));
      script.onerror=()=>done(new Error('Module inaccessible : '+src));
      win.document.head.appendChild(script);
    });
  }
  async function check(){
    attempts++;const ticket=generation;
    try{
      const win=frame.contentWindow,workshop=win.RDNWorkshop,view=workshop&&workshop.renderer;
      if(!view||view.kind!=='babylon'){
        if(installed){report.state='error';status.textContent='Erreur 3D · utiliser Réessayer dans l’atelier.';installed=null;}
        else if(attempts===30)status.textContent='La 3D se charge encore. Réessayer est disponible dans l’atelier.';
        return;
      }
      if(view===installed||installing)return;
      installing=true;report.state='installing';
      status.textContent='Atelier 0.3 · préparation des matières et de l’équipement…';
      await loadInWorkshop(win,'./visual-detail.js?v=0.2.0','RDNVisualPass');
      await loadInWorkshop(win,'./equipment-detail.js?v=0.3.0','RDNEquipmentPass');
      if(ticket!==generation||workshop.renderer!==view)return;
      win.RDNVisualPass.install(workshop,win.BABYLON);
      win.RDNEquipmentPass.install(workshop,win.BABYLON,win.RDNMotion);
      const checkbox=win.document.getElementById('bones');
      if(checkbox){checkbox.checked=false;checkbox.dispatchEvent(new win.Event('change'));}
      workshop.render(0);
      if(workshop.renderer!==view)throw new Error('Le premier rendu de l’aperçu a échoué.');
      installed=view;report.state='ready';
      const notice=win.document.querySelector('.notice');
      if(notice)notice.textContent='Prototype 3D v0.3 · épée, port bas, casque et décor. Appuis d’origine conservés.';
      status.textContent='Atelier 0.3 · nouvelle épée, port bas, casque arrondi et décor';
    }catch(error){
      console.error(error);report.state='error';report.errors.push(error.message);
      status.textContent='Amélioration indisponible · l’atelier original reste accessible.';
      stop();
    }finally{if(ticket===generation)installing=false;}
  }
  function begin(){stop();generation++;attempts=0;installing=false;installed=null;timer=setInterval(check,500);check();}
  frame.addEventListener('load',begin);
  addEventListener('pagehide',stop);
  addEventListener('pageshow',e=>{if(e.persisted)begin();});
  begin();
})();
</script>
</body>
</html>
