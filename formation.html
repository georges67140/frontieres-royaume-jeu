function build(n){number=n;actors.length=0;const cols=n===30?6:10,rows=n/cols;unitScale=n===30?.55:.27;for(let i=0;i<n;i++){const col=i%cols,row=Math.floor(i/cols);actors.push({time:i*.37,mode:'idle',clock:0,guard:0,arrows:[],dust:[],steps:[],target:0,x:0,speed:0,face:1,cycle:i%2,foot:[-13,13],start:[-13,13],end:[-13,13],swing:-1,progress:0,bodyX:0,chargeBlend:0,ammo:0,bayonet:false,bx:(col-(cols-1)/2)*65,by:(row-(rows-1)/2)*58,side:(row-(rows-1)/2)/rows,offsetY:0,col,row,cols,pace:.89+((i*37)%17)/70,pending:null,delay:0});}activeOrder='idle';document.querySelector('#sizeLabel').textContent=n+' guerriers';document.querySelector('#density').textContent=n===30?'Voir 200 guerriers':'Voir 30 guerriers';}
function busy(){return actors.some(a=>['shoot','reload','fire','fit'].includes(a.mode)||['shoot','reload','fire','fit'].includes(a.pending?.mode));}
function issue(m,destination){if(weapon==='musket'&&m==='shield')m='reload';if(weapon==='musket'&&m==='shoot'){if(!actors.every(a=>a.ammo===1))return;m='fire';}if(m==='reload'&&actors.every(a=>a.ammo===1))return;if(weapon==='spear'&&m==='shoot')m='thrust';if(busy())return;activeOrder=m;const center=actors.reduce((s,a)=>s+a.x,0)/number,dir=center>70?-1:1;const dest=destination===undefined?clamp(center+dir*(m==='charge'?190:95),-145,145):destination;for(const a of actors){a.pending={mode:weapon==='musket'&&m==='charge'&&!a.bayonet?'fit':m,target:dest};a.delay=(a.cols-1-a.col)*.15+a.row*.035+(1.14-a.pace)*.7;} }
document.querySelectorAll('[data-weapon]').forEach(b=>b.onclick=()=>{if(busy()||actors.some(a=>a.pending))return;weapon=b.dataset.weapon;document.querySelector('#shield').textContent=weapon==='musket'?'↻ Recharger':'🛡 Bouclier';document.querySelector('#charge').textContent=weapon==='musket'?'⚔ Charger au fusil':'⚔ Charger';document.querySelector('#shoot').textContent=weapon==='spear'?'Coup de lance':weapon==='musket'?'💥 Tirer':'🏹 Tirer';document.querySelectorAll('[data-weapon]').forEach(el=>el.classList.toggle('active',el.dataset.weapon===weapon));});
document.querySelector('#walk').onclick=()=>issue('move');document.querySelector('#charge').onclick=()=>issue('charge');document.querySelector('#shield').onclick=()=>issue(weapon==='musket'?'reload':activeOrder==='shield'?'idle':'shield');document.querySelector('#shoot').onclick=()=>issue('shoot');document.querySelector('#density').onclick=()=>{if(!busy()&&!actors.some(a=>a.pending))build(number===30?200:30);};
c.onpointerdown=e=>{gesture={start:e.clientX,current:e.clientX};c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(gesture)gesture.current=e.clientX};c.onpointercancel=()=>gesture=null;c.onpointerup=e=>{if(!gesture)return;const avg=actors.reduce((s,a)=>s+a.x,0)/number;issue('move',clamp(avg+(e.clientX-gesture.start)/(scale*unitScale),-145,145));gesture=null;};
function groupUpdate(dt){worldTime+=dt;for(const a of actors){if(a.pending){a.delay-=dt;if(a.delay<=0){a.mode=a.pending.mode;a.clock=0;a.target=a.pending.target;a.pending=null;}}loadActor(a);update(dt*a.pace);saveActor(a);a.offsetY=mix(a.offsetY,a.mode==='charge'?a.side*Math.abs(a.x)*.24:0,Math.min(1,dt*1.8));}
const locked=busy(),ready=actors.filter(a=>a.ammo===1).length;document.querySelectorAll('nav button').forEach(b=>{b.disabled=locked||(weapon==='musket'&&(b.id==='shoot'?ready<number:b.id==='shield'?ready===number:false));b.classList.toggle('active',b.id===activeOrder||(b.id==='walk'&&activeOrder==='move')||(b.id==='shield'&&activeOrder==='reload')||(b.id==='shoot'&&activeOrder==='fire'));});document.querySelectorAll('[data-weapon]').forEach(b=>b.disabled=locked||actors.some(a=>a.pending));document.querySelector('#density').disabled=locked||actors.some(a=>a.pending);const moving=actors.filter(a=>a.speed>1).length,waiting=actors.filter(a=>a.pending).length;const loading=actors.filter(a=>a.mode==='reload'),firing=actors.filter(a=>a.mode==='fire');const shotTime=Math.min(...(loading.length?loading:firing).map(a=>a.clock));
phase.textContent=actors.some(a=>a.mode==='fit'||a.pending?.mode==='fit')?'Fixer les baïonnettes · puis charger':locked?(weapon==='musket'?(activeOrder==='reload'?(shotTime<2?'Prendre la poudre':shotTime<4?'Poudre · balle':shotTime<6.2?'Bourrer avec la baguette':'Préparer le chargement')+' · '+ready+'/'+number+' chargés':shotTime<1.1?'Épauler les fusils':shotTime<3.3?'Viser · tenir le feu':shotTime<3.9?'Feu !':'Abaisser les fusils'):'Volée : rengainer → prendre l’arc → viser → tirer'):activeOrder==='shield'?(actors.every(a=>a.guard>.98)?'Premier rang : face à l’ennemi · arrière : toit de boucliers':'Premier rang en garde · les rangs arrière lèvent leurs boucliers'):moving||waiting?moving+' en mouvement · '+waiting+' attendent le signal':weapon==='musket'?(ready===number?'Fusils chargés · prêts à tirer':'Fusils vides · appuyez sur Recharger'):'Formation prête · glissez pour la déplacer';}

function groupRender(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b302b');bg.addColorStop(.4,'#526249');bg.addColorStop(1,'#253a2c');g.fillStyle=bg;g.fillRect(0,0,W,H);g.save();g.translate(ox,H*.56);g.scale(scale,scale);ellipse(0,15,205,165,'#88866a25');for(let i=0;i<400;i++){const px=Math.sin(i*127.1)*200,py=Math.cos(i*73.7)*165;line([[px,py],[px+Math.sin(worldTime*1.3+i),py-3-i%4]],i%3?'#a8af7342':'#223c2b77',.8);}
for(const a of [...actors].sort((a,b)=>a.by+a.offsetY-b.by-b.offsetY)){loadActor(a);g.save();g.scale(unitScale,unitScale);g.translate(a.bx,a.by+a.offsetY);for(const p of steps)ellipse(p.x,1,7,2,`rgba(30,32,20,${.2*(1-p.age/18)})`);warrior();for(const p of dust)ellipse(p.x-p.age*7,-p.age*6,(2+p.age*5)*(p.power||1),1+p.age*3,`rgba(184,174,126,${(1-p.age)*.14})`);for(const ar of arrows){if(ar.bullet){if(ar.t<.2)line([[ar.x-ar.dir*9,ar.y],[ar.x,ar.y]],'#e3d8b5',1.2);ellipse(ar.sx+ar.dir*ar.t*8,ar.sy-ar.t*7,6+ar.t*13,4+ar.t*9,`rgba(215,213,186,${Math.max(0,.24*(1-ar.t/3.5))})`);}else line([[ar.x-ar.dir*20,ar.y],[ar.x,ar.y]],'#e3d8b5',1.5);}g.restore();}g.restore();if(gesture){line([[gesture.start,H*.75],[gesture.current,H*.75]],'#e7d4a4',2);ellipse(gesture.current,H*.75,5,5,'#e7d4a4');}}
build(30);document.addEventListener('visibilitychange',()=>last=performance.now());function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;groupUpdate(dt);groupRender();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();</script></html>
